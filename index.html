<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAMUYA</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;

            /* FUNDO BEGE */
            background: #e9dfcc;

            color: #222;
            overflow-x: hidden;
        }

        /* Pequenos efeitos no fundo */
        body::before {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            filter: blur(100px);
            top: -200px;
            left: -150px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(190, 170, 130, 0.15);
            filter: blur(100px);
            bottom: -200px;
            right: -150px;
            z-index: -1;
        }

        /* CONTAINER */
        .container {
            width: 100%;
            max-width: 600px;
            padding: 55px 20px 30px;
            text-align: center;
        }

        /* LOGO */
        .logo {
            width: 115px;
            height: 115px;

            margin: auto;

            border-radius: 50%;

            background: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            box-shadow:
                0 8px 30px rgba(70, 55, 35, 0.18);

            animation: appear 0.7s ease;
        }

        /* IMAGEM DA SAMUYA */
        .logo img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            padding: 8px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* NOME */
        h1 {
            margin-top: 20px;

            font-size: 28px;
            font-weight: 800;

            letter-spacing: 1px;

            color: #171717;
        }

        .tagline {
            margin-top: 7px;

            color: #665f54;

            font-size: 14px;
        }

        /* DESCRIÇÃO */
        .description {
            margin: 18px auto 30px;

            max-width: 500px;

            color: #514c45;

            font-size: 15px;

            line-height: 1.55;
        }

        /* LINKS */
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link {
            position: relative;

            width: 100%;
            min-height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            color: #26231f;

            font-size: 16px;
            font-weight: 600;

            background: rgba(255, 255, 255, 0.72);

            border: 1px solid rgba(80, 65, 45, 0.10);

            border-radius: 16px;

            box-shadow:
                0 7px 20px rgba(70, 55, 35, 0.10);

            transition: all 0.25s ease;

            opacity: 0;
            transform: translateY(20px);

            animation: slideUp 0.6s forwards;
        }

        .link:nth-child(1) {
            animation-delay: 0.15s;
        }

        .link:nth-child(2) {
            animation-delay: 0.25s;
        }

        .link:nth-child(3) {
            animation-delay: 0.35s;
        }

        .link:nth-child(4) {
            animation-delay: 0.45s;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .link:hover {
            transform: translateY(-4px) scale(1.015);

            background: #ffffff;

            box-shadow:
                0 13px 30px rgba(70, 55, 35, 0.18);
        }

        .link:active {
            transform: scale(0.97);
        }

        /* ÍCONES */
        .icon {
            position: absolute;

            left: 20px;

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #eee6d8;

            color: #3f3a33;

            font-size: 19px;

            transition: 0.25s ease;
        }

        .link:hover .icon {
            transform: scale(1.12);

            background: #e4dac8;
        }

        /* FOOTER */
        footer {
            margin-top: 30px;

            font-size: 12px;

            color: #81786b;
        }

        footer strong {
            color: #4b443a;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .container {
                padding: 40px 16px 25px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }

            h1 {
                font-size: 24px;
            }

            .description {
                font-size: 14px;
            }

            .link {
                min-height: 62px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- LOGO SAMUYA -->
        <div class="logo">

            <img src="Áreas (4)-Photoroom.png
" alt="Samuya">

        </div>


        <!-- NOME -->
        <h1>SAMUYA</h1>

        <p class="tagline">
            Where calm meets sound
        </p>


        <!-- DESCRIÇÃO -->
        <p class="description">
            Um sistema inteligente de gestão auditiva que adapta
            a experiência sonora ao que realmente importa.
        </p>


        <!-- LINKS -->
        <div class="links">

            <!-- FACEBOOK -->
            <a
                href="https://www.facebook.com/share/1DfLtr19bJ/"
                target="_blank"
                class="link"
            >
                <span class="icon">
                    <i class="fa-brands fa-facebook-f"></i>
                </span>

                Facebook
            </a>


            <!-- INSTAGRAM -->
            <a
                href="https://www.instagram.com/samuya_26/"
                target="_blank"
                class="link"
            >
                <span class="icon">
                    <i class="fa-brands fa-instagram"></i>
                </span>

                Instagram
            </a>


            <!-- LINKEDIN -->
            <a
                href="https://www.linkedin.com/company/samuya/"
                target="_blank"
                class="link"
            >
                <span class="icon">
                    <i class="fa-brands fa-linkedin-in"></i>
                </span>

                LinkedIn
            </a>


            <!-- WEBSITE -->
            <a
                href="LINK_WEBSITE"
                target="_blank"
                class="link"
            >
                <span class="icon">
                    <i class="fa-solid fa-globe"></i>
                </span>

                Website
            </a>

        </div>


        <!-- FOOTER -->
        <footer>
            <strong>SAMUYA</strong><br>
            Where calm meets sound
        </footer>

    </main>

</body>
</html>
